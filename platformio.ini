[env:mkrzero]
platform = atmelsam
board = mkrzero
framework = arduino
monitor_speed = 115200
lib_deps = 
	robotis-git/Dynamixel2Arduino@^0.8.1
	robotis-git/DynamixelShield@^0.2.6
	pfeerick/elapsedMillis@^1.0.6
